<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PRs-AI</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans',
          Helvetica, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid #d1d9e0;
      }
      .logo {
        width: 24px;
        height: 24px;
        background: #2da44e;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
      }
      .title {
        font-size: 16px;
        font-weight: 600;
        color: #24292f;
      }
      .status-section {
        margin-bottom: 16px;
      }
      .status-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
      }
      .status-indicator {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 8px;
      }
      .status-indicator.connected {
        background: #2da44e;
      }
      .status-indicator.disconnected {
        background: #cf222e;
      }
      .status-indicator.unknown {
        background: #656d76;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 16px;
        border: 1px solid #d1d9e0;
        border-radius: 6px;
        background: #f6f8fa;
        color: #24292f;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        width: 100%;
        margin-bottom: 8px;
        transition: all 0.2s ease;
      }
      .button:hover:not(:disabled) {
        background: #f3f4f6;
        border-color: #afb8c1;
      }
      .button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .button.primary {
        background: #2da44e;
        color: #ffffff;
        border-color: #2da44e;
      }
      .button.primary:hover:not(:disabled) {
        background: #2c974b;
        border-color: #2c974b;
      }
      .quick-actions {
        margin-top: 12px;
      }
      .section-title {
        font-weight: 600;
        margin-bottom: 8px;
        color: #24292f;
      }
      .loading {
        opacity: 0.6;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
