<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PRs-AI Settings</title>
    <style>
      body {
        max-width: 800px;
        margin: 0 auto;
        padding: 32px 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans',
          Helvetica, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        background: #f6f8fa;
        color: #24292f;
      }
      .container {
        background: #ffffff;
        border: 1px solid #d1d9e0;
        border-radius: 12px;
        padding: 32px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .header {
        text-align: center;
        margin-bottom: 32px;
        padding-bottom: 24px;
        border-bottom: 1px solid #d1d9e0;
      }
      .logo {
        width: 48px;
        height: 48px;
        background: #2da44e;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 20px;
        margin: 0 auto 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 700;
      }
      .subtitle {
        color: #656d76;
        margin: 0;
      }
      .section {
        margin-bottom: 32px;
      }
      .section h2 {
        margin: 0 0 16px;
        font-size: 18px;
        font-weight: 600;
        color: #24292f;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #24292f;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #d1d9e0;
        border-radius: 6px;
        font-size: 14px;
        background: #ffffff;
        box-sizing: border-box;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: #0969da;
        box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.1);
      }
      .input-with-button {
        display: flex;
        gap: 8px;
      }
      .input-with-button input {
        flex: 1;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 16px;
        border: 1px solid #d1d9e0;
        border-radius: 6px;
        background: #f6f8fa;
        color: #24292f;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.2s ease;
        white-space: nowrap;
      }
      .button:hover:not(:disabled) {
        background: #f3f4f6;
        border-color: #afb8c1;
      }
      .button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .button.primary {
        background: #2da44e;
        color: #ffffff;
        border-color: #2da44e;
      }
      .button.primary:hover:not(:disabled) {
        background: #2c974b;
        border-color: #2c974b;
      }
      .button.secondary {
        background: #0969da;
        color: #ffffff;
        border-color: #0969da;
      }
      .button.secondary:hover:not(:disabled) {
        background: #0860ca;
        border-color: #0860ca;
      }
      .checkbox-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .checkbox-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .checkbox-item input[type='checkbox'] {
        width: auto;
        margin: 0;
      }
      .status-message {
        padding: 12px 16px;
        border-radius: 6px;
        margin-bottom: 16px;
        font-weight: 500;
      }
      .status-message.success {
        background: #dafbe1;
        color: #1a7f37;
        border: 1px solid #2da44e;
      }
      .status-message.error {
        background: #ffebe9;
        color: #cf222e;
        border: 1px solid #ff818266;
      }
      .help-text {
        font-size: 12px;
        color: #656d76;
        margin-top: 4px;
      }
      .api-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        margin-top: 8px;
      }
      .status-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .status-indicator.connected {
        background: #2da44e;
      }
      .status-indicator.disconnected {
        background: #cf222e;
      }
      .status-indicator.unknown {
        background: #656d76;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid #d1d9e0;
      }
      .onboarding {
        background: #fff8dc;
        border: 1px solid #f1c40f;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 24px;
      }
      .onboarding h3 {
        margin: 0 0 12px;
        color: #856404;
      }
      .guide-steps {
        margin: 16px 0;
      }
      .guide-steps ol {
        margin: 8px 0;
        padding-left: 24px;
      }
      .guide-steps li {
        margin-bottom: 8px;
      }
      .guide-steps a {
        color: #0969da;
        text-decoration: none;
      }
      .guide-steps a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">AI</div>
        <h1>PRs-AI Settings</h1>
        <p class="subtitle">
          Configure your AI providers and generation preferences
        </p>
      </div>

      <div id="root"></div>
    </div>
  </body>
</html>
